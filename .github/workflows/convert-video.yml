name: Convert wind turbine video

on:
  push:
    branches:
      - main
    paths:
      - "Photos/WindTurbine.ogv"
      - ".github/workflows/convert-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Convert OGV to MP4
        run: |
          ffmpeg -y \
            -i Photos/WindTurbine.ogv \
            -an \
            -c:v libx264 \
            -preset medium \
            -crf 23 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            Photos/WindTurbine.mp4

      - name: Commit MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Photos/WindTurbine.mp4
          if git diff --cached --quiet; then
            echo "No video changes to commit."
          else
            git commit -m "Add browser-compatible wind turbine video"
            git push
          fi
